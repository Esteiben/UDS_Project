<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Urban Data Solutions{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .card-kpi { transition: transform 0.2s; }
        .card-kpi:hover { transform: translateY(-3px); }
        .table-hover tbody tr:hover { background-color: #e9ecef; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-city me-2"></i>UDS Analytics
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-chart-line me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clients"><i class="fa-solid fa-building me-1"></i>Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/drivers"><i class="fa-solid fa-id-card me-1"></i>Conductores</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports"><i class="fa-solid fa-file-pdf me-1"></i>Reportes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/alerts"><i class="fa-solid fa-bell me-1"></i>Alertas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/upload"><i class="fa-solid fa-cloud-upload-alt me-1"></i>Cargar Datos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <small>&copy; 2026 Urban Data Solutions. Todos los derechos reservados.</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
